name: Verify retained original iOS Feed reader captures

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original reader capture run to verify after an evidence-guard repair
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check original-reader evidence guards
        run: python3 -m unittest discover -s scripts/tests -p test_ios_feed_reader.py
      - name: Bind retained captures to their actual execution and clean source
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$REFERENCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REFERENCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REFERENCE_RUN/jobs" > "$RUNNER_TEMP/source-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REFERENCE_RUN/artifacts" > "$RUNNER_TEMP/source-artifacts.json"
          gh run download "$REFERENCE_RUN" --repo "$GITHUB_REPOSITORY" --name ios-feed-reader --dir "$RUNNER_TEMP/source"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((tmp / 'source-run.json').read_text())
          jobs = json.loads((tmp / 'source-jobs.json').read_text())
          artifacts = json.loads((tmp / 'source-artifacts.json').read_text())
          source = json.loads((tmp / 'source/feed-reader-reference/Provenance.json').read_text())
          assert run['path'] == '.github/workflows/ios-feed-reader.yml'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['event'] == 'workflow_dispatch' and run['status'] == 'completed'
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          assert source['projectSourceCommit'] == run['head_sha'] and source['projectSourceDirty'] is False
          assert jobs['total_count'] == len(jobs['jobs']) == 1
          job = jobs['jobs'][0]
          assert job['name'] == 'capture' and job['status'] == 'completed'
          steps = {step['name']: step for step in job['steps']}
          required = ['Check evidence guards and prepare immutable offline host',
              'Capture original phone sheet states with actual standard text',
              'Capture original sheet states with actual accessibility text',
              'Capture original tablet sheet states']
          assert all(steps[name]['conclusion'] == 'success' for name in required)
          selected = [a for a in artifacts['artifacts'] if a['name'] == 'ios-feed-reader' and not a['expired']]
          assert len(selected) == 1 and artifacts['total_count'] == len(artifacts['artifacts'])
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('REFERENCE_COMMIT=' + run['head_sha'] + '\n')
          receipt = dict(schema=1, sourceRun=run['id'], sourceRunConclusion=run['conclusion'],
              sourceJob=job['id'], sourceCommit=run['head_sha'], sourceArtifact=selected[0],
              metadataSha256={name: hashlib.sha256((tmp/name).read_bytes()).hexdigest()
                  for name in ['source-run.json', 'source-jobs.json', 'source-artifacts.json']},
              verifiedExecutionSteps=required, verifierCommit=os.environ['GITHUB_SHA'],
              scope='Reassociate unchanged original reader exports after evidence-guard repair. All three actual capture steps must have passed; no new UI execution and no full parity claim.')
          (tmp / 'association.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Verify every declared original reader frame and observation
        run: |
          python3 scripts/verify-ios-feed-reader.py --exported "$RUNNER_TEMP/source/feed-reader-exported" \
            --output "$RUNNER_TEMP/canonical" --project-commit "$REFERENCE_COMMIT" > "$RUNNER_TEMP/association-output.json"
      - name: Preserve bound original reader references
        uses: actions/upload-artifact@v4
        with:
          name: ios-feed-reader-verified
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/canonical
            ${{ runner.temp }}/association.json
            ${{ runner.temp }}/source-run.json
            ${{ runner.temp }}/source-jobs.json
            ${{ runner.temp }}/source-artifacts.json
