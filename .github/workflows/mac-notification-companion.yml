name: Custom cmux Mac notification companion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-notification-companion
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CMUX_DEV_BACKEND_MODE: local
      CMUX_RELOAD_NO_GLOBAL_CLI_LINKS: '1'
      CMUX_SWIFT_FRONTEND_WORKAROUND: '1'
      CMUX_RELOAD_APP_EMIT_MODULE: '1'
      CMUX_IROH_V2_ENVIRONMENT: production
      CMUX_IROH_V2_BASE_URL: https://cmux-iroh-v2.debussy.workers.dev
      CARGO_BUILD_JOBS: '2'
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: cmux-app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: manaflow-ai/cmux
          ref: a5911a1f92f3eeb11c4d7f3e2ef89204718c5009
          path: upstream
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the pinned Xcode SDK family
        working-directory: upstream
        run: |
          set -euo pipefail
          pin_major="$(cut -d. -f1 .xcode-version)"
          CMUX_CI_MAX_MACOS_SDK_MAJOR="$pin_major" ./scripts/select-ci-xcode.sh
      - name: Prepare pinned native toolchain
        working-directory: upstream
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          ./scripts/install-zig-ci.sh
      - name: Prepare full native dependencies and verified Ghostty framework
        working-directory: upstream
        run: |
          set -euo pipefail
          ./scripts/setup.sh
      - name: Install reviewed Android notification hooks
        run: |
          python3 cmux-app/scripts/apply-native-push-patch.py --target "$GITHUB_WORKSPACE/upstream"
          python3 upstream/scripts/localization_catalog.py check --catalog "$GITHUB_WORKSPACE/upstream/Resources/Localizable.xcstrings"
      - name: Verify native pairing and producer integration
        working-directory: cmux-app
        run: |
          python3 scripts/check-companion-email-sign-in.py --upstream "$GITHUB_WORKSPACE/upstream" --output build/mac-checks/email-sign-in
          python3 scripts/check-mac-cli-suggestions.py --upstream "$GITHUB_WORKSPACE/upstream" --output build/mac-checks/cli-suggestions
          python3 scripts/check-native-push-keychain.py --upstream "$GITHUB_WORKSPACE/upstream" --output build/mac-checks/keychain
          python3 scripts/check-native-push-hooks.py --upstream "$GITHUB_WORKSPACE/upstream" --node "$(command -v node)" --output build/mac-checks/hooks
          python3 scripts/check-native-push-pairing.py --node "$(command -v node)" --patched-app-delegate build/mac-checks/hooks/patched/Sources/AppDelegate.swift --output build/mac-checks/pairing
          python3 scripts/check-native-push-owner.py --node "$(command -v node)" --output build/mac-checks/owner
          python3 -m unittest discover -s scripts/tests -p test_native_push_patch.py
          python3 -m unittest discover -s scripts/tests -p test_mac_companion_build_cache.py
      - name: Identify compatible Mac compiler cache
        id: compiler_cache_keys
        run: |
          python3 cmux-app/scripts/mac-companion-build-cache.py keys \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --derived-data "$RUNNER_TEMP/cmux-android-push-derived" \
            --output cmux-app/build/mac-checks/compiler-cache-inputs.json
      - name: Restore compatible Mac compiler results
        id: compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/cmux-android-push-derived/Build/Intermediates.noindex
            ${{ runner.temp }}/cmux-android-push-derived/Build/Products/Debug
            ${{ runner.temp }}/cmux-android-push-derived/ModuleCache.noindex
            ${{ runner.temp }}/cmux-android-push-derived/SDKStatCaches.noindex
            ${{ runner.temp }}/cmux-android-push-derived/SourcePackages
          key: ${{ steps.compiler_cache_keys.outputs.key }}
          restore-keys: |
            ${{ steps.compiler_cache_keys.outputs.sourcePrefix }}
            ${{ steps.compiler_cache_keys.outputs.prefix }}
      - name: Prepare patched sources for incremental compilation
        env:
          CACHE_OUTCOME: ${{ steps.compiler_cache.outcome }}
        run: |
          set -euo pipefail
          if [ "$CACHE_OUTCOME" != success ]; then
            rm -rf "$RUNNER_TEMP/cmux-android-push-derived"
          fi
          python3 cmux-app/scripts/mac-companion-build-cache.py normalize \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --output cmux-app/build/mac-checks/compiler-source-timestamps.json
      - name: Build the full tagged app with production account routing
        id: native_build
        working-directory: upstream
        env:
          CMUX_GHOSTTYKIT_PREPROVISIONED: '1'
          CACHE_MATCHED_KEY: ${{ steps.compiler_cache.outcome == 'success' && steps.compiler_cache.outputs.cache-matched-key || '' }}
        run: |
          set -euo pipefail
          run_build() {
            ./scripts/reload.sh --tag android-push --prod-auth --no-global-cli-links \
              --derived-data "$RUNNER_TEMP/cmux-android-push-derived"
          }
          set +e
          run_build 2>&1 | tee "$RUNNER_TEMP/cmux-android-push-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ] && [ -n "$CACHE_MATCHED_KEY" ]; then
            echo "::warning::Cached build failed; preserving its log and retrying once without compiler cache"
            if [ -f /tmp/cmux-reload-android-push.log ]; then
              cp /tmp/cmux-reload-android-push.log "$RUNNER_TEMP/cmux-android-push-cache-attempt.log"
            fi
            rm -rf "$RUNNER_TEMP/cmux-android-push-derived"
            set +e
            run_build 2>&1 | tee "$RUNNER_TEMP/cmux-android-push-build.log"
            build_status=${PIPESTATUS[0]}
            set -e
          fi
          exit "$build_status"
      - name: Package and verify the isolated development app
        id: package
        run: |
          python3 cmux-app/scripts/package-mac-notification-companion.py \
            --app "$RUNNER_TEMP/cmux-android-push-derived/Build/Products/Debug/cmux DEV android-push.app" \
            --upstream "$GITHUB_WORKSPACE/upstream" --output "$GITHUB_WORKSPACE/cmux-app/build/mac-companion"
      - name: Upload verified development bundle
        uses: actions/upload-artifact@v4
        with:
          name: cmux-mac-notification-companion-arm64
          path: cmux-app/build/mac-companion/
          if-no-files-found: error
          retention-days: 14
      - name: Measure compiler cache size
        id: compiler_cache_size
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cmux-android-push-derived'
          names = ['Build/Intermediates.noindex', 'Build/Products/Debug', 'ModuleCache.noindex',
                   'SDKStatCaches.noindex', 'SourcePackages']
          paths = [str(root / name) for name in names if (root / name).exists()]
          kib = sum(int(row.split()[0]) for row in subprocess.check_output(['du', '-sk', *paths], text=True).splitlines()) if paths else 0
          enabled = 0 < kib <= 4 * 1024 * 1024
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('enabled=' + str(enabled).lower() + '\n')
          print(f'Compiler cache: {kib} KiB; save enabled: {enabled} (4 GiB limit)')
          PY
      - name: Save verified Mac compiler results
        if: steps.compiler_cache_size.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/cmux-android-push-derived/Build/Intermediates.noindex
            ${{ runner.temp }}/cmux-android-push-derived/Build/Products/Debug
            ${{ runner.temp }}/cmux-android-push-derived/ModuleCache.noindex
            ${{ runner.temp }}/cmux-android-push-derived/SDKStatCaches.noindex
            ${{ runner.temp }}/cmux-android-push-derived/SourcePackages
          key: ${{ steps.compiler_cache_keys.outputs.key }}
      - name: Preserve compiled app after a packaging failure
        id: recovery
        if: ${{ failure() && steps.native_build.outcome == 'success' && steps.package.outcome == 'failure' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmux-build-recovery"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/cmux-android-push-derived/Build/Products/Debug/cmux DEV android-push.app" \
            "$RUNNER_TEMP/cmux-build-recovery/cmux-android-push-UNVERIFIED.zip"
          python3 - <<'PY'
          import hashlib, json, os, plistlib, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          output = temp / 'cmux-build-recovery'
          archive = output / 'cmux-android-push-UNVERIFIED.zip'
          info = plistlib.loads((temp / 'cmux-android-push-derived/Build/Products/Debug/cmux DEV android-push.app/Contents/Info.plist').read_bytes())
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          def commit(directory):
              return subprocess.check_output(['git', '-C', str(workspace / directory), 'rev-parse', 'HEAD'], text=True).strip()
          with archive.open('rb') as handle:
              digest = hashlib.file_digest(handle, 'sha256').hexdigest()
          receipt = {'kind': 'unverified-compiled-app-recovery', 'archive': archive.name, 'sha256': digest,
                     'projectCommit': commit('cmux-app'), 'upstreamCommit': commit('upstream'),
                     'reportedBundleID': info.get('CFBundleIdentifier'), 'verified': False,
                     'scope': 'Packaging failed. Inspect source, configuration, architecture and signatures before using this app. Runtime acceptance remains unverified.'}
          (output / 'recovery.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Upload unverified compiled app for recovery
        if: ${{ failure() && steps.recovery.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cmux-mac-notification-UNVERIFIED-recovery
          path: ${{ runner.temp }}/cmux-build-recovery/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build and integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmux-mac-notification-build-diagnostics
          path: |
            ${{ runner.temp }}/cmux-android-push-build.log
            ${{ runner.temp }}/cmux-android-push-cache-attempt.log
            /tmp/cmux-reload-android-push.log
            cmux-app/build/mac-checks/
          if-no-files-found: ignore
          retention-days: 14
