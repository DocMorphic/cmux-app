name: Android build

on:
  schedule:
    - cron: '7,27,47 * * * *'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a signed GitHub preview from main after verification
        required: false
        type: boolean
        default: false
      native_only:
        description: Build the pinned Iroh arm64 dependency instead of APKs
        required: false
        type: boolean
        default: false
      graphics_only:
        description: Rebuild the pinned AndroidX graphics-path JNI dependency
        required: false
        type: boolean
        default: false
      ghostty_only:
        description: Build the pinned Ghostty Android terminal dependency
        required: false
        type: boolean
        default: false
      video_only:
        description: Build the pinned simulator video decoder dependency
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ (github.event_name == 'schedule' || inputs.publish_preview) && 'preview' || github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test update policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_update_policy.py'
      - name: Decide whether to build
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python3 scripts/android-preview-decision.py
          elif [ "$PUBLISH_PREVIEW" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
            python3 scripts/android-preview-decision.py --force
          else
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: decide
    # Draft feature commits accumulate without rebuilding release APKs.
    # Build a milestone manually, or automatically once the PR is ready.
    if: needs.decide.outputs.should_build == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.native_only && !inputs.graphics_only && !inputs.ghostty_only && !inputs.video_only) || (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned viewer assets
        run: python3 scripts/verify-viewer-assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Mac helper
        run: node --test bridge/*.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore pinned Iroh dependency
        id: iroh-cache
        uses: actions/cache@v4
        with:
          path: build/iroh-android
          key: ${{ runner.os }}-iroh-ee19f156-ndk28-api26-arm64-${{ hashFiles('scripts/build-iroh-android.py') }}
      - uses: actions/checkout@v4
        if: steps.iroh-cache.outputs.cache-hit != 'true'
        with:
          repository: manaflow-ai/iroh-ffi
          ref: ee19f156667ca640b912108a45f8b5bb8d156fec
          path: native/iroh-ffi
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        if: steps.iroh-cache.outputs.cache-hit != 'true'
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android
      - name: Build missing native dependency from pinned source
        if: steps.iroh-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 scripts/build-iroh-android.py --source native/iroh-ffi --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/iroh-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore graphics-path native dependency
        id: graphics-cache
        uses: actions/cache@v4
        with:
          path: build/graphics-path-android
          key: ${{ runner.os }}-graphics-path-relro-${{ hashFiles('scripts/build-graphics-path-android.py', 'scripts/verify-native-alignment.py', 'third_party/androidx-graphics-path/**') }}
      - name: Rebuild graphics-path JNI with 16 KiB RELRO
        if: steps.graphics-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 scripts/build-graphics-path-android.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/graphics-path-android
      - name: Restore Android Ghostty binding
        id: ghostty-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ghostty-vt-android/manifest.json
            build/ghostty-vt-android/jni-manifest.json
            build/ghostty-vt-android/jniLibs
            build/ghostty-vt-android/notices
          key: ${{ runner.os }}-ghostty-edefce77-ndk28-api26-arm64-${{ hashFiles('scripts/build-ghostty-vt-android.py', 'scripts/build-ghostty-jni-android.py', 'scripts/verify-native-alignment.py', 'ghostty/src/main/c/**', 'ghostty/src/main/zig/**') }}
      - uses: actions/checkout@v4
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        with:
          repository: manaflow-ai/ghostty
          ref: edefce7785c9f439966c68588db1edbd6b435203
          path: native/ghostty
          persist-credentials: false
      - name: Build pinned Ghostty core and Android binding
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;28.2.13676358'
          curl -fsSL --retry 2 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          python3 scripts/build-ghostty-vt-android.py --source native/ghostty --zig "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/ghostty-vt-android
          python3 scripts/build-ghostty-jni-android.py --core build/ghostty-vt-android --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Restore simulator video decoder
        id: simulator-cache
        uses: actions/cache@v4
        with:
          path: |
            build/simulator-codecs-android/manifest.json
            build/simulator-codecs-android/jni-manifest.json
            build/simulator-codecs-android/jniLibs
            build/simulator-codecs-android/notices
          key: ${{ runner.os }}-simulator-ffmpeg-946fcce0-ndk28-api26-arm64-${{ hashFiles('scripts/build-simulator-codecs.py', 'scripts/build-simulator-video-jni.py', 'scripts/verify-native-alignment.py', 'app/src/main/c/simulator_video_jni.c') }}
      - uses: actions/checkout@v4
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        with:
          repository: FFmpeg/FFmpeg
          ref: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          path: native/ffmpeg
          persist-credentials: false
      - name: Build pinned simulator video decoder
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 scripts/build-simulator-codecs.py --source native/ffmpeg --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          python3 scripts/build-simulator-video-jni.py --core build/simulator-codecs-android --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-simulator-video-android-arm64
          path: |
            build/simulator-codecs-android/manifest.json
            build/simulator-codecs-android/jni-manifest.json
            build/simulator-codecs-android/jniLibs
            build/simulator-codecs-android/notices
      - name: Prepare stable release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CMUX_APP_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CMUX_APP_RELEASE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cmux-app-release.p12"
          chmod 600 "$RUNNER_TEMP/cmux-app-release.p12"
      - name: Test and build Android APKs
        env:
          CMUX_APP_RELEASE_KEYSTORE: ${{ runner.temp }}/cmux-app-release.p12
          CMUX_APP_RELEASE_PASSWORD: ${{ secrets.CMUX_APP_RELEASE_PASSWORD }}
        run: ./gradlew :ghostty:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace
      - name: Verify signed APK contents and all native alignment
        run: |
          python3 scripts/verify-signed-apk.py app/build/outputs/apk/release/app-release.apk --version "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/cmux-signed-verification"
          python3 scripts/verify-native-alignment.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify release classes on Android 17 ART
        timeout-minutes: 12
        run: |
          sdkmanager 'emulator' 'system-images;android-37.0;google_apis_ps16k;x86_64'
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd --force --name cmux-release-verify --package 'system-images;android-37.0;google_apis_ps16k;x86_64'
          mkdir -p "$RUNNER_TEMP/cmux-runtime-verification"
          "$ANDROID_HOME/emulator/emulator" -avd cmux-release-verify -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -memory 2048 -cores 2 > "$RUNNER_TEMP/cmux-runtime-verification/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; wait "$emulator_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 120); do
            kill -0 "$emulator_pid"
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          python3 scripts/verify-android-classload.py app/build/outputs/apk/release/app-release.apk --serial emulator-5554 --output "$RUNNER_TEMP/cmux-runtime-verification/classload.log"
      - name: Retain Android runtime verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmux-android-runtime-verification
          path: ${{ runner.temp }}/cmux-runtime-verification
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-app-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-app-stable-signed-apk
          path: app/build/outputs/apk/release/app-release.apk

  publish-preview:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish_preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cmux-app-stable-signed-apk
          path: release
      - name: Record verified build provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('release')
          digest = hashlib.sha256((root / 'app-release.apk').read_bytes()).hexdigest()
          receipt = {'source': os.environ['GITHUB_SHA'], 'versionCode': int(os.environ['GITHUB_RUN_NUMBER']),
                     'sha256': digest, 'workflowRun': os.environ['GITHUB_RUN_ID']}
          (root / 'manifest.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (root / 'SHA256SUMS').write_text(digest + '  app-release.apk\n')
          notes = ('<!-- cmux-preview-source: ' + receipt['source'] + ' -->\n\n'
                   'Signed Android preview. Source: `' + receipt['source'] + '`.\n\n'
                   'Passed JVM tests, asset checks, helper tests, signature verification and 16 KB alignment checks. '
                   'Automated packaging does not establish full iOS parity or physical-device acceptance.\n\n'
                   'Install app-release.apk to update the release app while retaining its data.\n')
          (root / 'notes.md').write_text(notes)
          PY
      - name: Publish immutable preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-preview-$GITHUB_RUN_NUMBER" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Android preview $GITHUB_RUN_NUMBER" --notes-file release/notes.md \
            release/app-release.apk release/SHA256SUMS release/manifest.json
          gh release edit "android-preview-$GITHUB_RUN_NUMBER" --repo "$GITHUB_REPOSITORY" --draft=false

  simulatornative:
    if: github.event_name == 'workflow_dispatch' && inputs.video_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          path: native/ffmpeg
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build simulator video native dependency
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 scripts/build-simulator-codecs.py --source native/ffmpeg --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          python3 scripts/build-simulator-video-jni.py --core build/simulator-codecs-android --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/cache/save@v4
        with:
          path: |
            build/simulator-codecs-android/manifest.json
            build/simulator-codecs-android/jni-manifest.json
            build/simulator-codecs-android/jniLibs
            build/simulator-codecs-android/notices
          key: ${{ runner.os }}-simulator-ffmpeg-946fcce0-ndk28-api26-arm64-${{ hashFiles('scripts/build-simulator-codecs.py', 'scripts/build-simulator-video-jni.py', 'scripts/verify-native-alignment.py', 'app/src/main/c/simulator_video_jni.c') }}
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-simulator-video-android-arm64
          path: |
            build/simulator-codecs-android/manifest.json
            build/simulator-codecs-android/jni-manifest.json
            build/simulator-codecs-android/jniLibs
            build/simulator-codecs-android/notices

  irohnative:
    if: github.event_name == 'workflow_dispatch' && inputs.native_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: manaflow-ai/iroh-ffi
          ref: ee19f156667ca640b912108a45f8b5bb8d156fec
          path: native/iroh-ffi
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/iroh-ffi
          key: cmux-iroh-android28-api26
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify Iroh native dependency
        run: python3 scripts/build-iroh-android.py --source native/iroh-ffi --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/iroh-android
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-iroh-android-arm64
          path: build/iroh-android
          if-no-files-found: error
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android Iroh module and device tests
        run: ./gradlew --no-daemon --max-workers=2 :iroh:assembleDebug :iroh:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-iroh-android-checkpoint
          path: |
            iroh/build/outputs/aar/iroh-debug.aar
            iroh/build/outputs/apk/androidTest/debug/iroh-debug-androidTest.apk
          if-no-files-found: error

  graphicsnative:
    if: github.event_name == 'workflow_dispatch' && inputs.graphics_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build graphics-path native dependency
        run: python3 scripts/build-graphics-path-android.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/graphics-path-android
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-graphics-path-android-arm64
          path: build/graphics-path-android
          if-no-files-found: error

  ghosttynative:
    if: github.event_name == 'workflow_dispatch' && inputs.ghostty_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: manaflow-ai/ghostty
          ref: edefce7785c9f439966c68588db1edbd6b435203
          path: native/ghostty
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build Ghostty core and JNI binding
        run: |
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          curl -fsSL --retry 2 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          python3 scripts/build-ghostty-vt-android.py --source native/ghostty --zig "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/ghostty-vt-android
          python3 scripts/build-ghostty-jni-android.py --core build/ghostty-vt-android --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package Android Ghostty module
        run: ./gradlew --no-daemon --max-workers=2 :ghostty:testDebugUnitTest :ghostty:assembleDebug :ghostty:assembleDebugAndroidTest
      - name: Verify packaged native alignment
        run: |
          python3 scripts/verify-native-alignment.py ghostty/build/outputs/aar/ghostty-debug.aar ghostty/build/outputs/apk/androidTest/debug/ghostty-debug-androidTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 ghostty/build/outputs/apk/androidTest/debug/ghostty-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-ghostty-android-arm64
          path: |
            build/ghostty-vt-android/manifest.json
            build/ghostty-vt-android/jni-manifest.json
            build/ghostty-vt-android/jniLibs
            build/ghostty-vt-android/notices
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-ghostty-android-runtime-tests
          path: ghostty/build/outputs/apk/androidTest/debug/ghostty-debug-androidTest.apk
          if-no-files-found: error
