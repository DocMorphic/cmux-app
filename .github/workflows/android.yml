name: Android build

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      native_only:
        description: Build the pinned Iroh arm64 dependency instead of APKs
        required: false
        type: boolean
        default: false
      graphics_only:
        description: Rebuild the pinned AndroidX graphics-path JNI dependency
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Draft feature commits accumulate without rebuilding release APKs.
    # Build a milestone manually, or automatically once the PR is ready.
    if: (github.event_name == 'workflow_dispatch' && !inputs.native_only && !inputs.graphics_only) || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned viewer assets
        run: python3 scripts/verify-viewer-assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Mac helper
        run: node --test bridge/*.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore pinned Iroh dependency
        id: iroh-cache
        uses: actions/cache@v4
        with:
          path: build/iroh-android
          key: ${{ runner.os }}-iroh-ee19f156-ndk28-api26-arm64-${{ hashFiles('scripts/build-iroh-android.py') }}
      - uses: actions/checkout@v4
        if: steps.iroh-cache.outputs.cache-hit != 'true'
        with:
          repository: manaflow-ai/iroh-ffi
          ref: ee19f156667ca640b912108a45f8b5bb8d156fec
          path: native/iroh-ffi
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        if: steps.iroh-cache.outputs.cache-hit != 'true'
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android
      - name: Build missing native dependency from pinned source
        if: steps.iroh-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 scripts/build-iroh-android.py --source native/iroh-ffi --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/iroh-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore graphics-path native dependency
        id: graphics-cache
        uses: actions/cache@v4
        with:
          path: build/graphics-path-android
          key: ${{ runner.os }}-graphics-path-relro-${{ hashFiles('scripts/build-graphics-path-android.py', 'scripts/verify-native-alignment.py', 'third_party/androidx-graphics-path/**') }}
      - name: Rebuild graphics-path JNI with 16 KiB RELRO
        if: steps.graphics-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 scripts/build-graphics-path-android.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/graphics-path-android
      - name: Prepare stable release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CMUX_APP_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CMUX_APP_RELEASE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cmux-app-release.p12"
          chmod 600 "$RUNNER_TEMP/cmux-app-release.p12"
      - name: Test and build Android APKs
        env:
          CMUX_APP_RELEASE_KEYSTORE: ${{ runner.temp }}/cmux-app-release.p12
          CMUX_APP_RELEASE_PASSWORD: ${{ secrets.CMUX_APP_RELEASE_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Verify all packaged native LOAD and RELRO segments
        run: |
          python3 scripts/verify-native-alignment.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-app-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-app-stable-signed-apk
          path: app/build/outputs/apk/release/app-release.apk

  irohnative:
    if: github.event_name == 'workflow_dispatch' && inputs.native_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: manaflow-ai/iroh-ffi
          ref: ee19f156667ca640b912108a45f8b5bb8d156fec
          path: native/iroh-ffi
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/iroh-ffi
          key: cmux-iroh-android28-api26
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify Iroh native dependency
        run: python3 scripts/build-iroh-android.py --source native/iroh-ffi --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/iroh-android
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-iroh-android-arm64
          path: build/iroh-android
          if-no-files-found: error
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android Iroh module and device tests
        run: ./gradlew --no-daemon --max-workers=2 :iroh:assembleDebug :iroh:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-iroh-android-checkpoint
          path: |
            iroh/build/outputs/aar/iroh-debug.aar
            iroh/build/outputs/apk/androidTest/debug/iroh-debug-androidTest.apk
          if-no-files-found: error

  graphicsnative:
    if: github.event_name == 'workflow_dispatch' && inputs.graphics_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build graphics-path native dependency
        run: python3 scripts/build-graphics-path-android.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/graphics-path-android
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-graphics-path-android-arm64
          path: build/graphics-path-android
          if-no-files-found: error
