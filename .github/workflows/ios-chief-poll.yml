name: Pinned iOS Chief Poll Details references

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-chief-poll
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: cmux-app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: manaflow-ai/cmux
          ref: a5911a1f92f3eeb11c4d7f3e2ef89204718c5009
          path: upstream
          sparse-checkout: |
            Packages/iOS/CmuxConversation
            scripts
          persist-credentials: false
      - name: Select the upstream Xcode SDK family
        working-directory: upstream
        run: |
          set -euo pipefail
          pin_major="$(cut -d. -f1 .xcode-version)"
          CMUX_CI_MAX_MACOS_SDK_MAJOR="$pin_major" ./scripts/select-ci-xcode.sh
          xcodebuild -version
      - name: Check poll reference guards
        run: python3 -m unittest discover -s cmux-app/scripts/tests -p test_ios_chief_polls.py
      - name: Prepare immutable offline poll host
        run: |
          python3 cmux-app/scripts/prepare-ios-chief-reference.py --upstream upstream --output "$RUNNER_TEMP/chief-reference" --with-poll-ui
      - name: Select a disposable runner simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          candidates = [d for devices in json.load(open(os.environ['RUNNER_TEMP'] + '/simulators.json'))['devices'].values() for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates: raise RuntimeError('No installed iPhone simulator runtime')
          selected = sorted(candidates, key=lambda d: (d['name'] != 'iPhone 17 Pro', d['name'] != 'iPhone 16 Pro', d['name']))[0]
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('REFERENCE_SIMULATOR=' + selected['udid'] + '\n')
          print({'name': selected['name'], 'udid': selected['udid'], 'state': selected['state']})
          Path(os.environ['RUNNER_TEMP'] + '/selected-simulator.json').write_text(json.dumps(selected, indent=2) + '\n')
          PY
      - name: Capture standard Poll Details through actual source controls
        run: |
          set -euo pipefail
          xcrun simctl boot "$REFERENCE_SIMULATOR" || xcrun simctl bootstatus "$REFERENCE_SIMULATOR" -b
          xcrun simctl bootstatus "$REFERENCE_SIMULATOR" -b
          xcrun simctl ui "$REFERENCE_SIMULATOR" content_size large
          xcodebuild test -project "$RUNNER_TEMP/chief-reference/CmuxChiefReference.xcodeproj" \
            -scheme CmuxChiefPoll -destination "platform=iOS Simulator,id=$REFERENCE_SIMULATOR" \
            -destination-timeout 90 -parallel-testing-enabled NO \
            -only-testing:CmuxChiefPollUITests/CmuxChiefPollUITests/testCaptureStandardChiefPollReferences \
            -only-testing:CmuxChiefPollUITests/CmuxChiefPollUITests/testPollDetailsSurvivesLiveRotation \
            -resultBundlePath "$RUNNER_TEMP/chief-reference-standard.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/chief-reference-standard-build.log"
      - name: Capture Poll Details with actual system accessibility type
        run: |
          set -euo pipefail
          xcrun simctl ui "$REFERENCE_SIMULATOR" content_size accessibility-medium
          xcrun simctl ui "$REFERENCE_SIMULATOR" content_size
          xcodebuild test -project "$RUNNER_TEMP/chief-reference/CmuxChiefReference.xcodeproj" \
            -scheme CmuxChiefPoll -destination "platform=iOS Simulator,id=$REFERENCE_SIMULATOR" \
            -destination-timeout 90 -parallel-testing-enabled NO \
            -only-testing:CmuxChiefPollUITests/CmuxChiefPollUITests/testCaptureAccessibilityChiefPollReferences \
            -resultBundlePath "$RUNNER_TEMP/chief-reference-accessibility.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/chief-reference-accessibility-build.log"
      - name: Capture remaining ten actual system text categories
        run: |
          set -euo pipefail
          xcrun simctl help ui
          while read -r category test_name; do
            xcrun simctl ui "$REFERENCE_SIMULATOR" content_size "$category"
            xcrun simctl ui "$REFERENCE_SIMULATOR" content_size
            xcodebuild test -project "$RUNNER_TEMP/chief-reference/CmuxChiefReference.xcodeproj" \
              -scheme CmuxChiefPoll -destination "platform=iOS Simulator,id=$REFERENCE_SIMULATOR" \
              -destination-timeout 90 -parallel-testing-enabled NO \
              -only-testing:"CmuxChiefPollUITests/CmuxChiefPollUITests/testCapture${test_name}PollReferences" \
              -resultBundlePath "$RUNNER_TEMP/chief-reference-type-$category.xcresult" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/chief-reference-type-$category-build.log"
          done <<'CATEGORIES'
          extra-small ExtraSmall
          small Small
          medium Medium
          extra-large ExtraLarge
          extra-extra-large ExtraExtraLarge
          extra-extra-extra-large ExtraExtraExtraLarge
          accessibility-large AccessibilityLarge
          accessibility-extra-large AccessibilityExtraLarge
          accessibility-extra-extra-large AccessibilityExtraExtraLarge
          accessibility-extra-extra-extra-large AccessibilityExtraExtraExtraLarge
          CATEGORIES
      - name: Export and verify scene payloads
        if: always()
        run: |
          set -euo pipefail
          for mode in standard accessibility; do
            if [ ! -d "$RUNNER_TEMP/chief-reference-$mode.xcresult" ]; then exit 1; fi
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/chief-reference-$mode.xcresult" --output-path "$RUNNER_TEMP/chief-reference-exported/$mode"
          done
          for result in "$RUNNER_TEMP"/chief-reference-type-*.xcresult; do
            if [ ! -d "$result" ]; then exit 1; fi
            mode="$(basename "$result" .xcresult)"
            xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/chief-reference-exported/$mode"
          done
          python3 cmux-app/scripts/verify-ios-chief-polls.py --exported "$RUNNER_TEMP/chief-reference-exported" --output "$RUNNER_TEMP/chief-reference-polls" --project-commit "$GITHUB_SHA" --require-lifecycle
      - name: Preserve reference evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-chief-poll
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chief-reference-polls
            ${{ runner.temp }}/chief-reference-exported
            ${{ runner.temp }}/chief-reference-standard.xcresult
            ${{ runner.temp }}/chief-reference-accessibility.xcresult
            ${{ runner.temp }}/chief-reference-standard-build.log
            ${{ runner.temp }}/chief-reference-accessibility-build.log
            ${{ runner.temp }}/chief-reference-type-*.xcresult
            ${{ runner.temp }}/chief-reference-type-*-build.log
            ${{ runner.temp }}/chief-reference/Provenance.json
            ${{ runner.temp }}/selected-simulator.json
