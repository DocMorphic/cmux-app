name: Pinned original iOS Feed reader sheet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-feed-reader
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: cmux-app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: manaflow-ai/cmux
          ref: a5911a1f92f3eeb11c4d7f3e2ef89204718c5009
          path: upstream
          sparse-checkout: |
            Packages/iOS/CmuxAgentChatUI/Sources/CmuxAgentChatUI/Artifacts
            Packages/iOS/CmuxAgentChatUI/Sources/CmuxAgentChatUI/Markdown
            Packages/Shared/CmuxAgentChat/Sources/CmuxAgentChat/MarkdownViewer
            Packages/iOS/CmuxAgentChatUI/Sources/CmuxAgentChatUI/Resources
            Packages/iOS/CmuxMobileShellModel/Sources/CmuxMobileShellModel
            Packages/iOS/CmuxMobileShellUI/Sources/CmuxMobileShellUI
            scripts
          persist-credentials: false
      - name: Select the upstream Xcode SDK family
        working-directory: upstream
        run: |
          set -euo pipefail
          pin_major="$(cut -d. -f1 .xcode-version)"
          CMUX_CI_MAX_MACOS_SDK_MAJOR="$pin_major" ./scripts/select-ci-xcode.sh
          xcodebuild -version
      - name: Check evidence guards and prepare immutable offline host
        run: |
          python3 -m unittest discover -s cmux-app/scripts/tests -p test_ios_feed_reader.py
          python3 cmux-app/scripts/prepare-ios-feed-reader-reference.py --upstream upstream --output "$RUNNER_TEMP/feed-reader-reference"
      - name: Select disposable runner simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          available = [d for group in json.load(open(os.environ['RUNNER_TEMP'] + '/simulators.json'))['devices'].values() for d in group if d.get('isAvailable')]
          selected = {}
          for kind, prefix in [('PHONE', 'iPhone'), ('TABLET', 'iPad')]:
              candidates = [d for d in available if d['name'].startswith(prefix)]
              if not candidates: raise RuntimeError('No installed ' + prefix + ' simulator')
              device = sorted(candidates, key=lambda d: (d['name'] != 'iPhone 17 Pro', '13-inch' not in d['name'], d['name']))[0]
              selected[kind] = device
              with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('REFERENCE_' + kind + '=' + device['udid'] + '\n')
          Path(os.environ['RUNNER_TEMP'] + '/selected-simulators.json').write_text(json.dumps(selected, indent=2) + '\n')
          print(selected)
          PY
      - name: Capture original phone sheet states with actual standard text
        timeout-minutes: 16
        run: |
          set -euo pipefail
          xcrun simctl boot "$REFERENCE_PHONE" || xcrun simctl bootstatus "$REFERENCE_PHONE" -b
          xcrun simctl bootstatus "$REFERENCE_PHONE" -b
          xcrun simctl ui "$REFERENCE_PHONE" content_size large
          xcodebuild test -project "$RUNNER_TEMP/feed-reader-reference/FeedFullTextReference.xcodeproj" \
            -scheme FeedFullTextReference -destination "platform=iOS Simulator,id=$REFERENCE_PHONE" \
            -destination-timeout 90 -parallel-testing-enabled NO \
            -only-testing:FeedFullTextUITests/FeedFullTextUITests/testCapturePhoneStandard \
            -resultBundlePath "$RUNNER_TEMP/feed-reader-standard.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/feed-reader-standard-build.log"
      - name: Capture original sheet states with actual accessibility text
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcrun simctl ui "$REFERENCE_PHONE" content_size accessibility-medium
          xcodebuild test -project "$RUNNER_TEMP/feed-reader-reference/FeedFullTextReference.xcodeproj" \
            -scheme FeedFullTextReference -destination "platform=iOS Simulator,id=$REFERENCE_PHONE" \
            -destination-timeout 90 -parallel-testing-enabled NO \
            -only-testing:FeedFullTextUITests/FeedFullTextUITests/testCapturePhoneEnlarged \
            -resultBundlePath "$RUNNER_TEMP/feed-reader-accessibility.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/feed-reader-accessibility-build.log"
          xcrun simctl shutdown "$REFERENCE_PHONE"
      - name: Capture original tablet sheet states
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcrun simctl boot "$REFERENCE_TABLET" || xcrun simctl bootstatus "$REFERENCE_TABLET" -b
          xcrun simctl bootstatus "$REFERENCE_TABLET" -b
          xcrun simctl ui "$REFERENCE_TABLET" content_size large
          xcodebuild test -project "$RUNNER_TEMP/feed-reader-reference/FeedFullTextReference.xcodeproj" \
            -scheme FeedFullTextReference -destination "platform=iOS Simulator,id=$REFERENCE_TABLET" \
            -destination-timeout 90 -parallel-testing-enabled NO \
            -only-testing:FeedFullTextUITests/FeedFullTextUITests/testCaptureTabletStandard \
            -resultBundlePath "$RUNNER_TEMP/feed-reader-tablet.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/feed-reader-tablet-build.log"
      - name: Export and associate all declared original sheet states
        if: always()
        run: |
          set -euo pipefail
          for result in "$RUNNER_TEMP"/feed-reader-*.xcresult; do
            if [ ! -d "$result" ]; then exit 1; fi
            mode="$(basename "$result" .xcresult)"
            xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/feed-reader-exported/$mode"
          done
          python3 cmux-app/scripts/verify-ios-feed-reader.py --exported "$RUNNER_TEMP/feed-reader-exported" \
            --output "$RUNNER_TEMP/feed-reader-canonical" --project-commit "$GITHUB_SHA"
      - name: Preserve source evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-feed-reader
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/feed-reader-canonical
            ${{ runner.temp }}/feed-reader-exported
            ${{ runner.temp }}/feed-reader-*-build.log
            ${{ runner.temp }}/feed-reader-reference/Provenance.json
            ${{ runner.temp }}/selected-simulators.json
      - name: Preserve full XCTest bundles when diagnosis is needed
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-feed-reader-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/feed-reader-*.xcresult
