<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; worker-src 'none'">
<title>Spreadsheet</title><link rel="stylesheet" href="viewer.css">
<script defer src="xlsx.full.min.js"></script><script defer src="workbook-model.js"></script><script defer src="ods-presentation.js"></script><script defer src="viewer.js"></script>
</head><body>
<nav aria-label="Workbook controls">
<label>Sheet <select id="sheets" aria-label="Worksheet"></select></label>
<div class="navigate"><button id="left" aria-label="Previous columns">←</button><button id="right" aria-label="Next columns">→</button>
<button id="up" aria-label="Previous rows">↑</button><button id="down" aria-label="Next rows">↓</button>
<label>Cell <input id="address" placeholder="A1" maxlength="64" autocapitalize="characters" autocomplete="off" spellcheck="false"></label><button id="go">Go</button></div>
<p id="range" aria-live="polite"></p><p id="limitations" hidden></p><p id="error" role="status"></p>
</nav><main id="content" aria-label="Workbook cells"></main>
</body></html>
