<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; worker-src 'none'">
<title>Presentation</title><link rel="stylesheet" href="viewer.css"><script type="module" src="viewer.js"></script>
</head><body>
<nav aria-label="Presentation controls">
<button id="previous" aria-label="Previous slide" disabled>Previous</button>
<label>Slide <input id="slide" type="number" inputmode="numeric" min="1" value="1" aria-label="Slide number"></label>
<span id="count"></span><button id="go" disabled>Go</button>
<button id="next" aria-label="Next slide" disabled>Next</button>
<p id="status" role="status" aria-live="polite">Loading presentation…</p>
</nav><main id="content" aria-label="Presentation slide"></main>
</body></html>
